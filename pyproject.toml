[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emotion_classification"
version = "0.1.0"
description = "Fine-tuning and serving of a text classifier for six emotions (dair-ai/emotion)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pierre Boissier" }]
dependencies = [
    "torch",
    "transformers",
    "pandas",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "tensorboard",
    "tqdm",
    "pyarrow",
    "huggingface_hub",
    "fastapi",
    "pydantic",
    "uvicorn",
]

[project.optional-dependencies]
notebooks = ["seaborn", "jupyter"]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["slow: end-to-end tests that train a tiny model (run with `pytest -m slow`)"]
addopts = "-m 'not slow'"
